# Enex Android APK'sını resmi Android araçlarıyla derler.
# Actions sekmesinde "Android APK" → son çalışma → Artifacts → Enex-Android (APK içeride).
# "v1.2.0-android" gibi bir etiket gönderirsen APK bir sürüm (Release) olarak da yayınlanır.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, android-app]
    paths:
      - 'android/**'
      - 'themes/**'
      - 'previews/**'
      - 'wallpapers/**'
      - 'assets/logo.svg'
      - '.github/workflows/android.yml'
    tags: ['v*-android']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK paketleri (platform 35, NDK r27c)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: İmza anahtarı (isteğe bağlı)
        env:
          KS_B64: ${{ secrets.ENEX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/enex.jks"
            echo "ENEX_KEYSTORE=$RUNNER_TEMP/enex.jks" >> "$GITHUB_ENV"
            echo "Sürekli imza anahtarı kullanılacak."
          else
            echo "::warning::ENEX_KEYSTORE_B64 tanımlı değil; APK hata ayıklama anahtarıyla imzalanacak (güncellemede önce eskisini kaldırman gerekebilir)."
          fi

      - name: APK derle
        env:
          ENEX_KEYSTORE_PASSWORD: ${{ secrets.ENEX_KEYSTORE_PASSWORD }}
          ENEX_KEY_ALIAS: ${{ secrets.ENEX_KEY_ALIAS }}
          ENEX_KEY_PASSWORD: ${{ secrets.ENEX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            # Hatayı özet olarak göster (kayıt dosyasını açmadan okunabilsin)
            grep -nE "error:|warning: |What went wrong|Exception|> Task .* FAILED|FAILURE|Could not|not found|^e: " "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            awk '/What went wrong/{f=1} f{print; n++} n>25{exit}' "$RUNNER_TEMP/build.log" | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit "$code"
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Enex-Android.apk
          # APK içeriği özeti (ByeDPI her mimari için var mı?)
          unzip -l ../Enex-Android.apk | grep -E "libciadpi|wallpapers/|themes/core|inject.js" | while IFS= read -r l; do echo "::notice::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Enex-Android
          path: Enex-Android.apk

      - name: Sürüm olarak yayınla
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Enex-Android.apk
